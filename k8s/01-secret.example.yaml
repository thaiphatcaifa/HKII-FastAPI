# Secret MẪU: chỉ có chỗ trống, KHÔNG chứa giá trị thật. Không commit bản đã điền.
# Cách dùng an toàn (không ghi giá trị ra file), xem docs/HUONG-DAN-CHAY.md mục Kubernetes:
#   kubectl create secret generic hkii-secret --from-literal=POSTGRES_PASSWORD=... --from-literal=SECRET_KEY=... ...
apiVersion: v1
kind: Secret
metadata:
  name: hkii-secret
  labels:
    app.kubernetes.io/part-of: hkii
type: Opaque
stringData:
  POSTGRES_PASSWORD: "<dat-mat-khau-postgres>"
  # Phải trùng mật khẩu ở dòng trên
  DATABASE_URL: "postgresql+psycopg://hkii:<dat-mat-khau-postgres>@db:5432/hkii"
  SECRET_KEY: "<chuoi-ngau-nhien-it-nhat-32-ky-tu>"
  SEED_PASSWORD: "<mat-khau-cho-tai-khoan-mau>"
  # Để trống thì AI chạy bằng bộ luật dự phòng
  GEMINI_API_KEY: ""
