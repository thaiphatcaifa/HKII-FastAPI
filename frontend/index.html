<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f766e" />
    <meta name="description" content="HKII - Hệ thống quản lý trung tâm: lớp học, điểm danh, điểm số, học phí và AI Coach." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>HKII - Quản lý trung tâm</title>
    <script>
      // Áp dụng bảng màu đã chọn trước khi vẽ trang để màu không bị nháy
      try {
        var saved = localStorage.getItem('hkii_theme')
        if (/^[a-z]{1,16}$/.test(saved)) document.documentElement.setAttribute('data-theme', saved)
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
