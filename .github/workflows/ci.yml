name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-sqlite:
    name: pytest (SQLite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest -q --cov=app --cov-report=term --cov-fail-under=90

  test-postgres:
    name: pytest (PostgreSQL)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hkii
          # Mật khẩu của container tạm trong CI, không dùng ở đâu khác
          POSTGRES_PASSWORD: hkii_ci
          POSTGRES_DB: hkii_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hkii -d hkii_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://hkii:hkii_ci@localhost:5432/hkii_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest -q --cov=app --cov-report=term --cov-fail-under=90

  frontend-build:
    name: Build frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
